name: Daily Telegram digest -> RSS feed for LinkedIn

on:
  schedule:
    # 08:00 Asia/Tashkent (UTC+5) = 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the entry without updating the feed"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch, select and update RSS feed
        working-directory: src
        timeout-minutes: 5
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || 'mutolaaxona' }}
          TELEGRAM_PROXY_TYPE: ${{ vars.TELEGRAM_PROXY_TYPE || 'socks5' }}
          TELEGRAM_PROXY_HOST: ${{ secrets.TELEGRAM_PROXY_HOST }}
          TELEGRAM_PROXY_PORT: ${{ secrets.TELEGRAM_PROXY_PORT }}
          TELEGRAM_PROXY_USERNAME: ${{ secrets.TELEGRAM_PROXY_USERNAME }}
          TELEGRAM_PROXY_PASSWORD: ${{ secrets.TELEGRAM_PROXY_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_TIMEZONE: ${{ vars.POST_TIMEZONE || 'Asia/Tashkent' }}
          FEED_BASE_URL: ${{ vars.FEED_BASE_URL }}
          FEED_TITLE: ${{ vars.FEED_TITLE || 'Mutolaa | Kunlik tanlov' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        run: python main.py

      - name: Commit updated feed and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/history.json state/last_post.json
          git diff --cached --quiet || git commit -m "chore: publish daily digest entry"
          git push
