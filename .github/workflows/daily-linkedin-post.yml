name: Daily digest -> RSS feed for LinkedIn

on:
  schedule:
    # 11:00 Asia/Tashkent (UTC+5) = 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the entry without updating the feed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-push

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Select yesterday's best post and update RSS feed
        working-directory: src
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || 'mutolaaxona' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_TIMEZONE: ${{ vars.POST_TIMEZONE || 'Asia/Tashkent' }}
          FEED_BASE_URL: ${{ vars.FEED_BASE_URL }}
          FEED_TITLE: ${{ vars.FEED_TITLE || 'Mutolaa | Daily pick' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        run: python main.py

      - name: Commit updated feed and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/history.json docs/images state/last_post.json
          git diff --cached --quiet || git commit -m "chore: publish daily digest entry"
          git push
