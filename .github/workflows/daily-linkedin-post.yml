name: Manual test - Telegram digest -> RSS feed for LinkedIn

# GitHub Actions runner IPs are blocked/throttled by Telegram, so the daily
# run happens locally instead (see scripts/run_daily.sh / run_daily.ps1 and
# the README's "Mahalliy avtomatlashtirish" section). This workflow is kept
# only for manually testing the fetch/select logic against real secrets.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the entry without updating the feed"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch, select and update RSS feed
        timeout-minutes: 4
        working-directory: src
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_PROXY_HOST: ${{ secrets.TELEGRAM_PROXY_HOST }}
          TELEGRAM_PROXY_PORT: ${{ secrets.TELEGRAM_PROXY_PORT }}
          TELEGRAM_PROXY_USERNAME: ${{ secrets.TELEGRAM_PROXY_USERNAME }}
          TELEGRAM_PROXY_PASSWORD: ${{ secrets.TELEGRAM_PROXY_PASSWORD }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || 'mutolaaxona' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_TIMEZONE: ${{ vars.POST_TIMEZONE || 'Asia/Tashkent' }}
          FEED_BASE_URL: ${{ vars.FEED_BASE_URL }}
          FEED_TITLE: ${{ vars.FEED_TITLE || 'Mutolaa | Kunlik tanlov' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        run: python -u main.py

      - name: Commit updated feed and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/history.json state/last_post.json
          git diff --cached --quiet || git commit -m "chore: publish daily digest entry"
          git push
